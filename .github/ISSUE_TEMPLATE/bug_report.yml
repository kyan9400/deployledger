name: Bug report
description: Report a reproducible problem in DeployLedger.
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: Include the endpoint, browser, or deployment context and a redacted response.
    validations: { required: true }
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations: { required: true }
