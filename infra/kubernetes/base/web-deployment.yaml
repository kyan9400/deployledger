apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployledger-web
  namespace: deployledger
  labels:
    app.kubernetes.io/name: deployledger-web
    app.kubernetes.io/part-of: deployledger
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: deployledger-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: deployledger-web
        app.kubernetes.io/part-of: deployledger
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/kyan9400/deployledger-web:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}

