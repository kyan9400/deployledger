apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: deployledger
  namespace: deployledger
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 1m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [deployledger.example.com]
      secretName: deployledger-tls
  rules:
    - host: deployledger.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: deployledger-api
                port:
                  name: http
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: deployledger-api
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: deployledger-web
                port:
                  name: http

