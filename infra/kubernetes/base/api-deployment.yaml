apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployledger-api
  namespace: deployledger
  labels:
    app.kubernetes.io/name: deployledger-api
    app.kubernetes.io/part-of: deployledger
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: deployledger-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: deployledger-api
        app.kubernetes.io/part-of: deployledger
    spec:
      serviceAccountName: deployledger-api
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/kyan9400/deployledger-api:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: deployledger-config
            - secretRef:
                name: deployledger-secrets
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

